services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: a2aviary_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d a2aviary_platform"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  platform-postgres:
